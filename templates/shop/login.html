{% extends 'base.html' %}
{% load socialaccount %}
{% block title %}Login | E-Shop{% endblock %}

{% block content %}

<div class="flex justify-center mt-10 mb-16 px-4">

    <div class="w-full max-w-md bg-white shadow-xl rounded-2xl overflow-hidden">

        <!-- Header -->
        <div class="bg-purple-600 text-white text-center py-4">
            <h2 class="text-xl font-semibold">Log In</h2>
        </div>

        <!-- Body -->
        <div class="p-6">

            <form method="post" class="space-y-5">
                {% csrf_token %}

                <!-- Username -->
                <div>
                    <label for="username" class="block text-gray-700 font-medium mb-1">
                        Username or Email
                    </label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        required
                        class="w-full border rounded-lg px-4 py-2 focus:ring-2 focus:ring-purple-300"
                    >
                </div>

                <!-- Password -->
                <div>
                    <label for="password" class="block text-gray-700 font-medium mb-1">
                        Password
                    </label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        required
                        class="w-full border rounded-lg px-4 py-2 focus:ring-2 focus:ring-purple-300"
                    >
                </div>

                <!-- Login Button -->
                <button 
                    type="submit" 
                    class="w-full bg-purple-600 text-white py-2 rounded-lg hover:bg-purple-700 transition font-semibold shadow">
                    Login
                </button>
            </form>

            <div class="my-6 border-t"></div>

            <!-- Google login -->
            <div class="text-center space-y-3">
                <p class="text-gray-600">Or sign in with:</p>

                <a href="{% provider_login_url 'google' next=request.GET.next %}"
                   class="w-full inline-flex justify-center items-center border border-red-500 text-red-500 py-2 rounded-lg hover:bg-red-50 transition shadow-sm">
                    <i class="fab fa-google mr-2"></i> Continue with Google
                </a>
            </div>

            <!-- Register section -->
            <div class="text-center mt-6">
                <p class="text-gray-600">
                    Don't have an account?
                    <a href="{% url 'shop:register' %}" class="text-purple-600 font-semibold hover:underline">
                        Sign up
                    </a>
                </p>
            </div>

        </div>
    </div>

</div>

{% endblock %}
